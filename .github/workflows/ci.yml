name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      store:
        description: Store profile (folder under src/test/resources/stores); empty = all example stores
        default: ""
      tags:
        description: Cucumber tag expression
        default: "@smoke"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        store: ${{ github.event.inputs.store != '' && fromJSON(format('["{0}"]', github.event.inputs.store)) || fromJSON('["shopify-dawn", "woocommerce-askomdch", "magento-hyva"]') }}
    name: e2e (${{ matrix.store }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: browser-actions/setup-chrome@v2

      - name: Run Cucumber scenarios
        env:
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
        run: >
          mvn -B test
          -Dheadless=true
          -Dstore=${{ matrix.store }}
          -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cucumber-reports-${{ matrix.store }}
          path: |
            target/cucumber-reports
            target/screenshots
            target/logs
          if-no-files-found: ignore
