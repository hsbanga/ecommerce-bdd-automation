# ---------------------------------------------------------------------------
# Framework defaults. Every key can be overridden by (highest priority first):
#   1. -Dkey=value on the Maven command line      e.g. -Dbrowser=edge
#   2. an environment variable KEY_WITH_UNDERSCORES e.g. BASE_URL, HEADLESS
#   3. stores/<store>/store.properties
#   4. this file
# ---------------------------------------------------------------------------

# Store profile to load from src/test/resources/stores/<store>/
store=shopify-dawn

# chrome | edge | firefox
browser=chrome
headless=false
# Leave empty to run locally; set to e.g. http://localhost:4444 to use a Selenium Grid
grid.url=

window.width=1920
window.height=1080

# seconds
timeout.element=15
timeout.pageLoad=60
timeout.script=30

# Attach a screenshot to the report after every step (failed steps always get one)
screenshot.everyStep=false
