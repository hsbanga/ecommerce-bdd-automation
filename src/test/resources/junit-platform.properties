# Cucumber runtime options. Every key can be overridden with -D on the Maven command line,
# e.g. -Dcucumber.filter.tags="@smoke" or -Dcucumber.execution.parallel.enabled=true
cucumber.publish.quiet=true
cucumber.snippet-type=camelcase
cucumber.object-factory=io.cucumber.picocontainer.PicoFactory
cucumber.glue=com.sarvadalabs.automation
cucumber.plugin=pretty, html:target/cucumber-reports/cucumber.html, json:target/cucumber-reports/cucumber.json, junit:target/cucumber-reports/cucumber.xml, rerun:target/cucumber-reports/rerun.txt

# Parallel execution: scenarios run in parallel, one browser per thread (driver is ThreadLocal).
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3
