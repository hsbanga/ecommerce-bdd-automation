# ---------------------------------------------------------------------------
# Baseline locator repository (Shopify Dawn theme, v15). Stores override any key
# in stores/<store>/locators.properties.
#
# Syntax:  key = strategy=value || strategy=value || ...
#   strategies: css (default), xpath, id, name, linkText, partialLinkText, class, tag
#   "||" separates fallback locators; the first one that matches a VISIBLE element wins.
#   {0}, {1} ... are replaced by arguments supplied from the page object.
# ---------------------------------------------------------------------------

# --- Header / global ---------------------------------------------------------
header.logo=css=.header__heading-logo || css=.header__heading-link || css=header a[href='/']
header.searchIcon=css=summary.header__icon--search || css=.header__icon--search || css=a[href='/search']
header.searchInput=css=input.search__input[type='search'] || css=input[name='q'][type='search'] || css=input[name='q']
header.cartIcon=css=#cart-icon-bubble || css=a[href='/cart'] || css=.header__icon--cart
header.cartCount=css=#cart-icon-bubble .cart-count-bubble span[aria-hidden='true'] || css=.cart-count-bubble span[aria-hidden='true'] || css=.cart-count-bubble
# Optional: cookie/newsletter popup close button. Leave empty when the store has none.
popup.close=

# --- Product grid (collection + search results) ------------------------------
grid.items=css=#product-grid li.grid__item || css=.product-grid .grid__item || css=ul.product-grid > li
grid.itemTitle=css=.card__heading a || css=.card__heading || css=.full-unstyled-link
grid.firstItemLink=css=#product-grid li.grid__item a[href*='/products/'] || css=.product-grid a[href*='/products/']

# --- Search results page ----------------------------------------------------
search.noResults=css=.template-search--no-results || css=.template-search__header || xpath=//p[contains(normalize-space(.),'No results')] || xpath=//h1[contains(normalize-space(.),'No results')]

# --- Product page ------------------------------------------------------------
product.title=css=.product__title h1 || css=h1.product__title || css=.product__info-container h1 || css=h1
product.price=css=.product__info-container .price__regular .price-item--regular || css=.product__info-container .price-item--regular || css=.price__regular .price-item || css=.product .price
product.addToCart=css=product-form button[name='add'] || css=form[action*='/cart/add'] button[type='submit'] || css=button.product-form__submit
product.quantityInput=css=.product__info-container input.quantity__input || css=input[name='quantity']
product.variantRadio=xpath=//variant-selects//input[@type='radio' and @value='{0}'] || xpath=//variant-radios//input[@type='radio' and @value='{0}'] || xpath=//fieldset//input[@type='radio' and @value='{0}']
product.variantRadioLabel=xpath=//variant-selects//input[@type='radio' and @value='{0}']/following-sibling::label[1] || xpath=//variant-radios//input[@type='radio' and @value='{0}']/following-sibling::label[1] || xpath=//label[normalize-space(.)='{0}']
product.variantSelect=css=variant-selects select || css=.product-form__input select || css=select[name^='options']
product.addedNotification=css=#cart-notification.active || css=#cart-notification[class*='active'] || css=cart-drawer.active || css=.cart-notification__heading
product.addedNotificationHeading=css=#cart-notification .cart-notification__heading || css=.cart-notification__heading || css=cart-drawer .drawer__heading

# --- Cart page ---------------------------------------------------------------
cart.items=css=cart-items .cart-item || css=.cart-item || css=tr.cart-item
cart.itemByName=xpath=//*[contains(@class,'cart-item')][.//a[contains(@class,'cart-item__name')][contains(normalize-space(.),'{0}')]] || xpath=//*[contains(@class,'cart-item')][.//*[contains(normalize-space(.),'{0}')]]
cart.itemName=css=.cart-item__name || css=.cart-item__details a
cart.itemQuantityInput=css=input.quantity__input || css=input[name^='updates']
cart.itemRemove=css=cart-remove-button a || css=cart-remove-button button || css=a[href*='quantity=0'] || css=.cart-item__remove
cart.itemLineTotal=css=.cart-item__totals .price--end || css=.cart-item__totals .price || css=.cart-item__price-wrapper .price
cart.subtotal=css=.totals__total-value || css=.totals__subtotal-value || css=.cart__subtotal
cart.emptyMessage=css=cart-items.is-empty .cart__empty-text || css=.cart__empty-text || css=.cart__warnings
cart.checkoutButton=css=#checkout || css=button[name='checkout'] || css=a[href*='/checkout']
cart.busyOverlay=css=cart-items.cart__items--disabled || css=.cart__items--disabled

# --- Checkout (Shopify hosted checkout) -------------------------------------
checkout.email=css=input#email || css=input[name='email'] || css=input[type='email']
checkout.firstName=css=input[name='firstName'] || css=#checkout_shipping_address_first_name
checkout.lastName=css=input[name='lastName'] || css=#checkout_shipping_address_last_name
checkout.address1=css=input[name='address1'] || css=#checkout_shipping_address_address1
checkout.city=css=input[name='city'] || css=#checkout_shipping_address_city
checkout.postalCode=css=input[name='postalCode'] || css=#checkout_shipping_address_zip
checkout.phone=css=input[name='phone'] || css=#checkout_shipping_address_phone
checkout.country=css=select[name='countryCode'] || css=#checkout_shipping_address_country
checkout.province=css=select[name='zone'] || css=#checkout_shipping_address_province

# --- Customer login ----------------------------------------------------------
login.email=css=#CustomerEmail || css=input[name='customer[email]']
login.password=css=#CustomerPassword || css=input[name='customer[password]']
login.submit=css=form#customer_login button:not([type='button']) || css=form[action*='/account/login'] button:not([type='button']) || css=form[action*='/account/login'] input[type='submit']
login.error=css=#login .form__message || css=form#customer_login .form__message || css=.form__message || css=.errors || xpath=//*[contains(normalize-space(.),'Incorrect email or password')]
# Bot protection widgets. When present the login submit may be intercepted; scenarios then skip rather than bypass it.
login.captcha=css=iframe[src*='hcaptcha'] || css=.h-captcha || css=iframe[src*='recaptcha'] || css=.g-recaptcha || css=#shopify-challenge
account.heading=css=.customer.account h1 || css=main h1 || xpath=//h1[contains(normalize-space(.),'Account')]
