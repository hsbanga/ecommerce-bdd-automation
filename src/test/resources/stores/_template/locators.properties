# ---------------------------------------------------------------------------
# TEMPLATE locator overrides. Only add the keys whose selectors differ from
# locators/default.properties (Shopify Dawn baseline). Everything else is inherited.
#
# Syntax reminder:  key = strategy=value || strategy=value
#   strategies: css (default), xpath, id, name, linkText, partialLinkText, class, tag
#   {0} {1}... are runtime arguments (e.g. a product name or variant value)
# ---------------------------------------------------------------------------

# Example: a store with a cookie banner
# popup.close=css=#cookie-banner button.accept || css=.cc-dismiss

# Example: a theme with a cart drawer instead of a cart notification
# product.addedNotification=css=cart-drawer.active || css=#CartDrawer.is-open
# product.addedNotificationHeading=css=cart-drawer .drawer__heading

# Example: WooCommerce store
# product.addToCart=css=button.single_add_to_cart_button
# cart.items=css=tr.woocommerce-cart-form__cart-item
# cart.itemQuantityInput=css=input.qty
# cart.checkoutButton=css=a.checkout-button
