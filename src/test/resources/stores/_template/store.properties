# ---------------------------------------------------------------------------
# TEMPLATE store profile. Copy this folder to stores/<client-name>/ and run with
#   mvn test -Dstore=<client-name>
# ---------------------------------------------------------------------------

# Appears in the page title on the home page
store.name=Client Store Name
# shopify | woocommerce | magento | generic  (only "shopify" enables the cart API steps)
store.platform=shopify
base.url=https://client-store.example.com

# Relative paths; {0} is substituted at runtime
path.home=/
path.cart=/cart
path.checkout=/checkout
path.login=/account/login
path.account=/account
path.search=/search?q={0}
path.product=/products/{0}
path.collection=/collections/{0}

# Valid customer for @requires-account scenarios (prefer env vars LOGIN_EMAIL / LOGIN_PASSWORD)
login.email=
login.password=
