# BigCommerce Cornerstone (Stencil) theme overrides of the Shopify Dawn baseline.

# --- Header ---
header.logo=css=.header-logo__link || css=.header-logo a
header.searchIcon=css=#quick-search-expand || css=.navUser-action--quickSearch
header.searchInput=css=#nav-quick-search || css=input[name='nav-quick-search'] || css=input[name='search_query']
header.cartIcon=css=.navUser-item--cart a || css=a[href$='/cart.php'][data-cart-preview] || css=a[href$='/cart.php']
# This theme configuration renders the cart badge (.countPill) empty, so the cart page is used for counts.
header.cartCount=

# --- Product grid (category + search results) ---
grid.items=css=.productGrid li.product || css=li.product
grid.itemTitle=css=.card-title a || css=.card-title
grid.firstItemLink=css=li.product .card-title a || css=li.product a.card-figure__link

# --- Search results ---
search.noResults=css=h1.page-heading || css=.page-heading

# --- Product page ---
product.title=css=h1.productView-title
product.price=css=.productView-price [data-product-price-without-tax] || css=.productView-price .price--withoutTax || css=.productView-price .price
product.addToCart=css=#form-action-addToCart
product.quantityInput=css=input[name='qty[]'] || css=.productView-options input.form-input--incrementTotal
product.variantRadio=xpath=//div[@data-product-option-change]//input[@type='radio'][following-sibling::label[1][normalize-space(.)='{0}']]
product.variantRadioLabel=xpath=//div[@data-product-option-change]//label[normalize-space(.)='{0}'] || xpath=//div[@data-product-option-change]//label[.//span[normalize-space(.)='{0}']]
product.variantSelect=css=[data-product-option-change] select
product.addedNotification=css=#previewModal.open || css=.modal.open .previewCart
product.addedNotificationHeading=css=#previewModal .alertBox-message || xpath=//div[@id='previewModal' and contains(@class,'open')]//*[contains(normalize-space(.),'added to your cart') and not(.//*[contains(normalize-space(.),'added to your cart')])] || css=#previewModal .modal-body

# --- Cart page ---
cart.items=css=tr.cart-item
cart.itemByName=xpath=//tr[contains(@class,'cart-item')][.//*[contains(@class,'cart-item-name')][contains(normalize-space(.),'{0}')]]
cart.itemName=css=.cart-item-name
cart.itemQuantityInput=css=input.cart-item-qty-input || css=input.form-input--incrementTotal
cart.itemRemove=css=.cart-remove
cart.removeConfirm=css=.swal2-confirm || css=button.confirm
cart.itemLineTotal=css=td.cart-item-info strong.cart-item-value || xpath=.//td[contains(@class,'cart-item-info')][.//span[normalize-space(.)='Total']]//*[contains(@class,'cart-item-value')]
cart.subtotal=xpath=//li[contains(@class,'cart-total')][.//strong[normalize-space(.)='Subtotal']]//div[contains(@class,'cart-total-value')] || css=.cart-total .cart-total-value
cart.emptyMessage=xpath=//*[contains(normalize-space(.),'cart is empty')][not(*)] || css=.cart-empty
cart.checkoutButton=css=.cart-actions a.button--primary || css=.cart-actions a[data-primary-checkout-now-action] || css=#checkout-button
cart.busyOverlay=css=.loadingOverlay

# --- Checkout (BigCommerce optimized one-page checkout: email step, then address form) ---
checkout.email=css=#email || css=input[name='email']
checkout.consentCheckbox=css=label[for='privacyPolicy'] || css=#privacyPolicy
checkout.continueAfterEmail=css=#checkout-customer-continue || css=button[data-test='customer-continue-as-guest-button']
checkout.firstName=css=#firstNameInput || css=input[name='firstName']
checkout.lastName=css=#lastNameInput || css=input[name='lastName']
checkout.address1=css=#addressLine1Input || css=input[name='address1']
checkout.city=css=#cityInput || css=input[name='city']
checkout.postalCode=css=#postCodeInput || css=input[name='postalCode']
checkout.phone=css=#phoneInput || css=input[name='phone']
checkout.country=css=select#countryCodeInput || css=select[name='countryCode']
checkout.province=css=select#provinceCodeInput || css=select[name='stateOrProvinceCode']

# --- Login ---
login.email=css=#login_email
login.password=css=#login_pass
login.submit=css=form[action*='check_login'] input[type='submit'] || css=form[action*='login'] .button--primary
login.error=css=.alertBox--error .alertBox-message || css=.alertBox--error || css=.alertBox
login.captcha=css=iframe[src*='recaptcha'] || css=.g-recaptcha || css=iframe[src*='hcaptcha'] || css=.h-captcha
account.heading=css=h1.page-heading || css=.account h1
