# Store profile: BigCommerce "Cornerstone" theme demo store (public, no password)
store.name=Cornerstone Demo
store.platform=bigcommerce
base.url=https://cornerstone-light-demo.mybigcommerce.com

# BigCommerce URL structure
path.home=/
path.cart=/cart.php
path.checkout=/checkout
path.login=/login.php
path.account=/account.php
path.search=/search.php?search_query={0}
path.product=/all/{0}/
path.collection=/{0}/

# Valid customer credentials for @requires-account scenarios (prefer env LOGIN_EMAIL / LOGIN_PASSWORD)
login.email=
login.password=
