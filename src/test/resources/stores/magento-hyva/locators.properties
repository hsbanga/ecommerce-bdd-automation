# Magento 2 with the Hyva theme (Alpine.js + Tailwind). Overrides the Shopify Dawn baseline.
# Luma-theme equivalents are listed as fallbacks where they differ.

# --- Header ---
header.logo=css=header a[href$='/default/'] || css=a.logo
header.searchIcon=css=#menu-search-icon || css=.block-search .label
header.searchInput=css=#search || css=input[name='q']
header.cartIcon=css=#menu-cart-icon || css=a.action.showcart
header.cartCount=css=#menu-cart-icon span[x-text='summaryCount'] || css=.counter-number

# --- Product grid (category + search results) ---
grid.items=css=form.product-item || css=li.product-item
grid.itemTitle=css=a.product-item-link
grid.firstItemLink=css=form.product-item a.product-item-link || css=li.product-item a.product-item-link

# --- Search results ---
search.noResults=xpath=//*[contains(normalize-space(.),'returned no results')][not(*)] || css=.message.notice

# --- Product page ---
product.title=css=h1.page-title || css=h1.page-title span
product.price=css=.product-info-main .price-box .price || css=.price-box .price
product.addToCart=css=#product-addtocart-button || css=button.tocart
product.quantityInput=css=input[name='qty'] || css=#qty
product.variantRadio=xpath=//input[@type='radio' and @data-option-label='{0}']
product.variantRadioLabel=xpath=//input[@type='radio' and @data-option-label='{0}']/parent::label || xpath=//label[contains(@class,'swatch-option')][.//span[normalize-space(.)='{0}']] || css=.swatch-option[option-label='{0}']
product.variantSelect=css=.product-options-wrapper select
product.addedNotification=css=.message.success || css=[role='alert'].success || xpath=//*[contains(@class,'message')][contains(normalize-space(.),'added')]
product.addedNotificationHeading=css=.message.success || css=[role='alert'].success || xpath=//*[contains(@class,'message')][contains(normalize-space(.),'added')]

# --- Cart page ---
cart.items=css=article.cart.item || css=#shopping-cart-table tbody.cart.item
cart.itemByName=xpath=//article[contains(@class,'cart') and contains(@class,'item')][.//*[contains(@class,'product-item-name')][contains(normalize-space(.),'{0}')]] || xpath=//tbody[contains(@class,'cart') and contains(@class,'item')][.//*[contains(@class,'product-item-name')][contains(normalize-space(.),'{0}')]]
cart.itemName=css=.product-item-name
cart.itemQuantityInput=css=input[data-role='cart-item-qty'] || css=input.qty
cart.itemRemove=css=button[aria-label^='Remove'] || css=.action-delete
cart.itemLineTotal=xpath=.//span[span[contains(@class,'sr-only') and normalize-space(.)='Subtotal']]//span[@class='price'] || css=td.subtotal .price
cart.subtotal=xpath=//div[contains(@x-text,'totalsData.subtotal')] || css=#cart-totals .sub .price || css=.totals.sub .price
cart.emptyMessage=xpath=//*[contains(normalize-space(.),'no items in your shopping cart')][not(*)] || css=.cart-empty
cart.checkoutButton=css=#checkout-link-button || css=button.checkout || css=.btn-checkout
cart.updateButton=css=button[name='update_cart_action']
cart.busyOverlay=css=.loading-mask

# --- Checkout (Hyva Checkout; Luma ids as fallbacks) ---
checkout.email=css=#guest_details-email_address || css=#customer-email
checkout.firstName=css=#shipping-firstname || css=input[name='firstname']
checkout.lastName=css=#shipping-lastname || css=input[name='lastname']
checkout.address1=css=#shipping-street-0 || css=input[name='street[0]']
checkout.city=css=#shipping-city || css=input[name='city']
checkout.postalCode=css=#shipping-postcode || css=input[name='postcode']
checkout.phone=css=#shipping-telephone || css=input[name='telephone']
checkout.country=css=select#shipping-country_id || css=select[name='country_id']
checkout.province=css=select#shipping-region || css=select[name='region_id']

# --- Login ---
login.email=css=#email || css=input[name='login[username]']
login.password=css=#pass || css=input[name='login[password]']
login.submit=css=form.form-login button[name='send'] || css=#customer-login-form button[type='submit'] || css=#send2
login.error=css=.message.error || css=[role='alert'].error || css=.messages .error || xpath=//*[contains(@class,'message')][contains(normalize-space(.),'incorrect')]
# Magento's built-in image captcha appears after repeated failed sign-ins
login.captcha=css=.captcha-image || css=img[alt*='CAPTCHA'] || css=iframe[src*='recaptcha'] || css=.g-recaptcha
account.heading=css=.page-title || css=h1
