# Store profile: Hyva theme demo, a public Magento 2 demo store ("No orders will be fulfilled")
# The home page <title> is literally "Home Page", which is what the title check compares against.
store.name=Home Page
store.platform=magento
# The store code is part of every URL on this instance
base.url=https://demo.hyva.io/default

# Magento 2 URL structure (product and category URL keys end in .html)
path.home=/
path.cart=/checkout/cart/
path.checkout=/checkout/
path.login=/customer/account/login/
path.account=/customer/account/
path.search=/catalogsearch/result/?q={0}
path.product=/{0}.html
path.collection=/{0}.html

# Valid customer credentials for @requires-account scenarios (prefer env LOGIN_EMAIL / LOGIN_PASSWORD)
login.email=
login.password=
