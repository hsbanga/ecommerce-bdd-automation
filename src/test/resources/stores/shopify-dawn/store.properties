# Store profile: Shopify "Dawn" theme demo store (public, not password protected)
store.name=theme-dawn-demo
store.platform=shopify
base.url=https://theme-dawn-demo.myshopify.com

# Relative paths; {0} is substituted by the page objects
path.home=/
path.cart=/cart
path.checkout=/checkout
path.login=/account/login
path.account=/account
path.search=/search?q={0}
path.product=/products/{0}
path.collection=/collections/{0}

# Valid customer credentials for @requires-account scenarios.
# Supply them via env vars LOGIN_EMAIL / LOGIN_PASSWORD instead of committing them here.
login.email=
login.password=
