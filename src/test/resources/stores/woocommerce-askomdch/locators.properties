# WooCommerce (classic templates) overrides of the Shopify Dawn baseline in locators/default.properties.

# --- Header ---
header.logo=css=.site-logo-img img || css=.custom-logo-link || css=.site-title a
header.searchIcon=css=.ast-search-menu-icon || css=.ast-search-icon
header.searchInput=css=input.search-field[name='s'] || css=input[name='s']
header.cartIcon=css=a.cart-container || css=a.ast-cart-menu-wrap || css=a[href*='/cart/']
header.cartCount=css=.ast-cart-menu-wrap .count || css=.cart-contents .count || css=.cart-count

# --- Product grid (category + search results) ---
grid.items=css=ul.products li.product
grid.itemTitle=css=.woocommerce-loop-product__title || css=h2
grid.firstItemLink=css=ul.products li.product a.woocommerce-LoopProduct-link || css=ul.products li.product a[href*='/product/']

# --- Search results ---
search.noResults=css=.woocommerce-no-products-found || css=.woocommerce-info || css=.no-results

# --- Product page ---
product.title=css=h1.product_title || css=.summary h1
product.price=css=.summary .price ins .amount || css=.summary .price .amount || css=.summary .price
product.addToCart=css=button.single_add_to_cart_button || css=form.cart button[type='submit']
product.quantityInput=css=form.cart input.qty || css=input[name='quantity']
product.variantSelect=css=table.variations select
product.variantRadio=xpath=//form[contains(@class,'cart')]//input[@type='radio' and @value='{0}']
product.variantRadioLabel=xpath=//form[contains(@class,'cart')]//input[@type='radio' and @value='{0}']/following-sibling::label[1]
product.addedNotification=css=.woocommerce-message || css=.wc-block-components-notice-banner.is-success
product.addedNotificationHeading=css=.woocommerce-message || css=.wc-block-components-notice-banner.is-success

# --- Cart page ---
cart.items=css=tr.woocommerce-cart-form__cart-item || css=tr.cart_item
cart.itemByName=xpath=//tr[contains(@class,'cart_item')][.//td[contains(@class,'product-name')][contains(normalize-space(.),'{0}')]]
cart.itemName=css=td.product-name a || css=td.product-name
cart.itemQuantityInput=css=input.qty || css=input[name^='cart['][name$='[qty]']
cart.itemRemove=css=a.remove || css=td.product-remove a
cart.itemLineTotal=css=td.product-subtotal .amount || css=td.product-subtotal
cart.subtotal=css=.cart-subtotal .amount || css=.cart-subtotal td
cart.emptyMessage=css=.cart-empty || css=.wc-empty-cart-message || css=.woocommerce-info
cart.checkoutButton=css=a.checkout-button || css=.wc-proceed-to-checkout a
cart.updateButton=css=button[name='update_cart']
cart.busyOverlay=css=.blockUI.blockOverlay || css=.processing

# --- Checkout (classic WooCommerce form) ---
checkout.email=css=#billing_email
checkout.firstName=css=#billing_first_name
checkout.lastName=css=#billing_last_name
checkout.address1=css=#billing_address_1
checkout.city=css=#billing_city
checkout.postalCode=css=#billing_postcode
checkout.phone=css=#billing_phone
checkout.country=css=select#billing_country
checkout.province=css=select#billing_state

# --- Login (WooCommerce my-account form) ---
login.email=css=#username || css=input[name='username']
login.password=css=#password || css=input[name='password']
login.submit=css=button[name='login'] || css=form.woocommerce-form-login button[type='submit']
login.error=css=.woocommerce-error || css=ul.woocommerce-error li || css=.wc-block-components-notice-banner.is-error
account.heading=css=.woocommerce-MyAccount-navigation || css=.woocommerce-MyAccount-content
