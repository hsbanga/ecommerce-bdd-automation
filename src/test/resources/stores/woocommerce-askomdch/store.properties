# Store profile: AskOmDch, a public WooCommerce practice store (Astra theme, classic cart/checkout)
store.name=AskOmDch
store.platform=woocommerce
base.url=https://askomdch.com

# WooCommerce URL structure
path.home=/
path.cart=/cart/
path.checkout=/checkout/
path.login=/account/
path.account=/account/
path.search=/?s={0}&post_type=product
path.product=/product/{0}/
path.collection=/product-category/{0}/

# Valid customer credentials for @requires-account scenarios (prefer env LOGIN_EMAIL / LOGIN_PASSWORD)
login.email=
login.password=
